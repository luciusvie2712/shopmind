name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_DB: shopmind
          POSTGRES_USER: shopmind
          POSTGRES_PASSWORD: shopmind_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopmind -d shopmind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://shopmind:shopmind_ci@localhost:5432/shopmind
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-only-test-secret-not-for-production
      GEMINI_API_KEY: ci-placeholder-not-used
      GEMINI_EMBEDDING_DIMENSION: 768

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration

      - name: Build web
        run: pnpm --filter web build

      - name: Build API
        run: pnpm --filter api build
